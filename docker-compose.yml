
services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: test_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "8081:80"
    networks:
      - app_network
    depends_on:
      mysql:
        condition: service_healthy

  fastapi:
    build: ./app
    container_name: fastapi_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: test_db
      DB_USER: admin
      DB_PASSWORD: admin123
    networks:
      - app_network
    depends_on:
      mysql:
        condition: service_healthy

  apache:
    build: ./apache
    container_name: apache_server
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - app_network
    depends_on:
      - fastapi

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge
